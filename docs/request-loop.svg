<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 396" width="960" height="396" role="img" aria-labelledby="sia-loop-title sia-loop-desc">
<title id="sia-loop-title">Plan, execute and check loop</title>
<desc id="sia-loop-desc">An advisor request goes to the orchestrator, which plans and executes it. Simple lookups use direct tools; numeric questions go to the Portfolio agent and meeting briefs to the Briefing agent. A completion checker reviews the combined answer. If it is complete with confidence of at least 0.5, the response goes to the advisor. Otherwise the gap is fed back to the orchestrator for another try, up to two loops and 25 model calls per run.</desc>
