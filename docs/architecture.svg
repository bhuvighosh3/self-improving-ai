<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" width="960" height="488" role="img" aria-labelledby="sia-arch-title sia-arch-desc">
<title id="sia-arch-title">Self-Improving AI copilot architecture</title>
<desc id="sia-arch-desc">The advisor uses the React app, which calls the FastAPI backend on Cloud Run. The backend passes each query to the Request Orchestrator, which loads its learned memory before each turn. It answers simple lookups with five direct workspace tools (calendar, email and CRM from Firestore, holdings from a local fixture), and delegates complex tasks to two sub-agents through ADK AgentTool: the Portfolio agent and the Briefing agent, which both use Twelve Data market data. The Briefing agent saves the full brief to DraftStore and returns a short summary. A completion checker reviews each answer and sends any gap back to the orchestrator, up to two loops, before the response returns to the app. Every request is traced to Cloud Trace. All agents run on Gemini through Vertex AI.</desc>
